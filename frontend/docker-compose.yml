services:
  app:
    container_name: aarogyamed-frontend
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: always
    ports:
      - "${APP_FORWARD_PORT:-3000}:${PORT:-3000}"
    expose:
      - "${PORT:-3000}"
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - aarogyamed-shared-network

networks:
  aarogyamed-shared-network:
    external: true
